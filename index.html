<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryoul | لوحة الأتمتة الشاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-light: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--border); }
        h1 { font-size: 1.1rem; font-weight: bold; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        textarea, input { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 0.9rem; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 8px; display: none; z-index: 1000; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>🛒 Maryoul Ops Hub</h1>
        <span style="font-size: 0.8rem; color: var(--success);">● متصل بـ Make Webhook</span>
    </header>

    <div class="card">
        <h3>🤖 مولد المحتوى والنشر التلقائي</h3>
        <textarea id="ai-content" rows="4" placeholder="اكتب أو ولد محتوى المنتج هنا..."></textarea>
        <button class="btn" onclick="publishContent()">🚀 إرسال ونشر إلى Make.com</button>
    </div>

    <div class="card">
        <h3>📊 إحصاءات العمليات اليومية</h3>
        <p style="color: var(--text-light); margin-top: 6px; font-size: 0.9rem;">إجمالي العمليات الناجحة اليوم: <strong style="color: var(--success);">88</strong></p>
    </div>

    <div id="toast" class="toast">تم الإرسال بنجاح!</div>

    <script>
        const WEBHOOK_URL = "https://hook.eu1.make.com/9m46zcwdywh..."; // رابط الـ Webhook الخاص بك

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        async function publishContent() {
            const content = document.getElementById('ai-content').value;
            if (!content) {
                showToast("الرجاء كتابة محتوى أولاً!");
                return;
            }
            
            showToast("جاري الإرسال إلى Make.com...");
            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content, timestamp: new Date().toISOString() })
                });
                if (res.ok) {
                    showToast("تم إرسال البيانات ونشرها بنجاح!");
                } else {
                    showToast("فشل في إرسال البيانات للخادم");
                }
            } catch (err) {
                showToast("خطأ في الاتصال بالشبكة");
            }
        }
    </script>
</body>
</html>
